<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#132c49" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon-48.png" />
    <title>Σχέδια ΥΠΕΠΑ</title>
    <!-- Theme before first paint (same rules as src/theme.ts): stored choice, else the OS setting. ES5 on purpose. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('ypepascan.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var s = null;
        try { s = localStorage.getItem('ypepascan.fontSize'); } catch (e) {}
        if (s === 'large' || s === 'xlarge') document.documentElement.setAttribute('data-size', s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
